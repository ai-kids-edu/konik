    // double-tap so eat/drink/firework (which have no cooldown of their own)
    // aren't consumed twice; buy/sell already rate-limit themselves. Safe and
    // simple now: one event type on an element that persists across rebuilds
    // while its action stays available, so `last` isn't reset out from under us.
    let last = -1e9;
    const fire = (e) => {
      e.preventDefault(); e.stopPropagation();
      if (e.timeStamp - last < 250) return;
      last = e.timeStamp;
      b.action();
    };
    btn.addEventListener('pointerdown', fire);
    container.appendChild(btn);
  }
}

function getInput() {
  let forward = 0, turn = 0, turnIntent = 0;

  // Freeze controls while eating or being groomed
  if (isEatingCarrots || isGrooming) return { forward: 0, turn: 0, turnIntent: 0, moving: false };

  // Steering is arrow keys only (+ mobile joystick below). WASD is intentionally
  // NOT bound to movement: W/S/D are action keys (drink napój / buy siano / buy
  // diament), and aliasing them to steering made the horse drink or buy while the
  // child was only trying to move.
  if (keys['ArrowUp']) forward = 1;
  if (keys['ArrowDown']) forward = -1;
  if (keys['ArrowLeft']) { turn = 1; turnIntent = 1; }
  if (keys['ArrowRight']) { turn = -1; turnIntent = -1; }

  if (isMobile) {
    forward += -joystickDir.y; // stick up = forward (negative y)
    const jx = -joystickDir.x; // stick left = turn left
    // turnIntent tracks the raw sideways push — used for the "am I moving/
    // turning" flag and the steering meter, so both reflect what the child does.
    turnIntent += jx;
    // Actual rotation is gentler: square the push (keeping its sign) and cap it
    // below full, so small/moderate tilts turn softly and even a full push isn't
    // twitchy. Keyboard turning is unchanged.
    turn += Math.sign(jx) * jx * jx * 0.8;
  }

  forward = THREE.MathUtils.clamp(forward, -1, 1);
  turn = THREE.MathUtils.clamp(turn, -1, 1);
  turnIntent = THREE.MathUtils.clamp(turnIntent, -1, 1);

  // moving keys off the raw intent, not the softened turn — otherwise a moderate
  // tilt (whose squared turn is <0.1) would rotate the horse while the game
  // treated it as idle (idle animation, meter hidden).
  const moving = Math.abs(forward) > 0.1 || Math.abs(turnIntent) > 0.1;
  return { forward, turn, turnIntent, moving };
}

// ========== MINIMAP ==========
let minimapCanvas, minimapCtx;
// Row rendering: <5 items → individual icons; ≥5 → "emoji × N" as big readable number
function buildCollectRow(emoji, count) {
  if (count === 0) return '';
  if (count >= 5) {
    return `<div class="row" style="font-size:44px;font-weight:900;line-height:1.1;display:flex;align-items:center;gap:8px">`
      + `<span style="font-size:52px">${emoji}</span>`
      + `<span style="color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,0.5)">× ${count}</span>`
      + `</div>`;
  }
  let html = '';
  for (let i = 0; i < count; i++) html += `<span class="single">${emoji}</span>`;
  return `<div class="row">${html}</div>`;
}

function updateCarrotHUD() {
  const hud = document.getElementById('collect-hud');
  if (!hud) return;

  // Shared badge style for action-key hints, tinted by hand color at call site.
  const badgeStyle = 'display:inline-block;background:#f6ecd0;color:#3a1d08;'
    + 'padding:2px 10px;border-radius:8px;font-family:monospace;font-size:28px;'
    + 'font-weight:900;box-shadow:0 2px 0 #b89040;vertical-align:middle;';

  let html = '';
  // Stamina bar row — actual bar fill + number are updated every frame by
  // updateStaminaBar() so the drain animates smoothly.
  html += `<div class="row" style="display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;color:#f6ecd0">`
    + `<span style="font-size:32px">⚡</span>`
    + `<div style="width:170px;height:20px;background:rgba(0,0,0,0.55);border:2px solid rgba(255,255,255,0.35);border-radius:10px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,0.4)">`
    + `<div id="stamina-fill" style="width:${Stamina.ratio*100}%;height:100%;background:#4ade5c;transition:width 0.12s"></div>`
    + `</div>`
    + `<span id="stamina-num" style="text-shadow:1px 1px 0 rgba(0,0,0,0.5)">${Math.round(Stamina.value)}</span>`
    + `</div>`;

  html += buildCollectRow('🥕', carrots);
  html += buildCollectRow('🍎', applesCollected);
  // Money: always shown as big number in its own row (kid reads exact coin count)
  html += `<div class="row" style="font-size:44px;font-weight:900;line-height:1.1;display:flex;align-items:center;gap:8px">`
    + `<span style="font-size:52px">🪙</span>`
    + `<span style="color:#ffd944;text-shadow:2px 2px 0 rgba(0,0,0,0.5)">× ${money}</span>`
    + `</div>`;

  // Inventory: one row per item, same emoji × N formatting for consistency.
  // Consumable items also get a key hint on the same row.
  for (const k of Object.keys(SHOP_ITEMS)) {
    const n = inventory[k] || 0;
    if (n > 0) {
      let row = `<div class="row" style="font-size:36px;font-weight:800;line-height:1.1;display:flex;align-items:center;gap:8px">`
        + `<span style="font-size:44px">${SHOP_ITEMS[k].emoji}</span>`
        + `<span style="color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,0.5)">× ${n}</span>`;
      const action = CONSUMABLE_ACTIONS[k];
      if (action) {
        if (isMobile) {
          row += `<span style="font-size:32px">👉</span>`
            + `<span style="color:#fff;font-size:28px;text-shadow:1px 1px 0 rgba(0,0,0,0.5)">${action.verb}</span>`;
        } else {
          row += `<span style="${badgeStyle};border:2px solid ${handColor(action.key)}">${action.key}</span>`
            + `<span style="color:#fff;font-size:28px;text-shadow:1px 1px 0 rgba(0,0,0,0.5)">${action.verb}</span>`
            + `<span style="font-size:18px;color:${handColor(action.key)};font-weight:800;opacity:0.9;margin-left:2px">${handLabel(action.key)} ręką</span>`;
        }
      }
      row += `</div>`;
      html += row;
    }
  }

  // Controls hint below inventory — separate visually so kid doesn't
  // read it as an owned item. Persistent so jump is always discoverable.
  html += `<div class="row" style="margin-top:10px;padding-top:8px;border-top:2px solid rgba(255,255,255,0.25);font-size:28px;font-weight:800;line-height:1;display:flex;align-items:center;gap:8px;color:#f6ecd0">`
    + (isMobile
        ? `<span style="font-size:32px">⤴️</span><span>skok konia</span>`
        : `<span style="${badgeStyle};border:2px solid ${handColor('E')}">E</span>`
          + `<span>skok konia</span>`
          + `<span style="font-size:18px;color:${handColor('E')};font-weight:800;opacity:0.9;margin-left:2px">${handLabel('E')} ręką</span>`)
    + `</div>`;
  // Sprint hint — desktop only (Shift has no touch equivalent).
  if (!isMobile) {
    html += `<div class="row" style="font-size:28px;font-weight:800;line-height:1;display:flex;align-items:center;gap:8px;color:#f6ecd0">`
      + `<span style="${badgeStyle};border:2px solid #7cc8ff;font-size:22px">Shift</span>`
      + `<span>sprint (⚡)</span>`
      + `<span style="font-size:18px;color:#7cc8ff;font-weight:800;opacity:0.9;margin-left:2px">lewą ręką</span>`
      + `</div>`;
  }

  hud.innerHTML = html || '&nbsp;';

  // Pop animation — clear any previous timer so rapid buys/sells don't stack.
  hud.style.transform = 'scale(1.15)';
  if (updateCarrotHUD._popTimer) clearTimeout(updateCarrotHUD._popTimer);
  updateCarrotHUD._popTimer = setTimeout(() => {
    hud.style.transform = 'scale(1)';
    updateCarrotHUD._popTimer = 0;
  }, 200);
}

// Cheap per-frame stamina bar refresh — mutates only the fill width + label
// so we avoid rerendering the whole HUD every tick.
function updateStaminaBar() {
  const fill = document.getElementById('stamina-fill');
  const num = document.getElementById('stamina-num');
  if (!fill || !num) return;
  const pct = Math.max(0, Math.min(100, Stamina.ratio * 100));
  const color = pct > 50 ? '#4ade5c' : pct > 20 ? '#ffaa33' : '#ff5544';
  fill.style.width = pct + '%';
  fill.style.background = color;
  num.textContent = Math.round(Stamina.value);
}

function initMinimap() {
  minimapCanvas = document.getElementById('minimap');
  minimapCtx = minimapCanvas.getContext('2d');
}

function drawMinimap() {
  const ctx = minimapCtx;
  if (!ctx) return;
  const W = 160, H = 160;
  const R = W / 2;
  const MAP_RANGE = 250;
  const CENTER_Z = -150; // shift so road+city visible in lower half

  function toMap(wx, wz) {
    return {
      x: (wx / MAP_RANGE * 0.5 + 0.5) * W,
      y: ((wz - CENTER_Z) / MAP_RANGE * 0.5 + 0.5) * H,
    };
  }

  ctx.clearRect(0, 0, W, H);

  // Clip to circle
  ctx.save();
  ctx.beginPath();
  ctx.arc(R, R, R - 2, 0, Math.PI * 2);
  ctx.clip();

  // Grass background with subtle gradient
  const grassGrad = ctx.createRadialGradient(R, R, 0, R, R, R);
  grassGrad.addColorStop(0, '#4a9a38');
  grassGrad.addColorStop(1, '#357028');
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, 0, W, H);

  // Dry south zone (Wild West outskirts)
  const southStart = toMap(0, FARM_SOUTH_EDGE).y;
  const cityStart = toMap(0, ROAD_SOUTH_EDGE).y;
  const cityEnd = toMap(0, CITY_SOUTH_EDGE).y;
  ctx.fillStyle = '#a89060';
  ctx.fillRect(0, southStart, W, cityEnd - southStart);
  // City zone (slightly darker)
  ctx.fillStyle = '#806848';
  ctx.fillRect(0, cityStart, W, cityEnd - cityStart);

  // Road corridor (sand strip)
  const roadLeft = toMap(-ROAD_HALF_WIDTH, 0).x;
  const roadRight = toMap(ROAD_HALF_WIDTH, 0).x;
  ctx.fillStyle = '#d4b890';
  ctx.fillRect(roadLeft, southStart, roadRight - roadLeft, cityEnd - southStart);

  // Farm area (soft brown circle)
  const fp = toMap(FARM_X, FARM_Z);
  const fr = (FARM_RADIUS / MAP_RANGE) * W * 0.5;
  const farmGrad = ctx.createRadialGradient(fp.x, fp.y, 0, fp.x, fp.y, fr);
  farmGrad.addColorStop(0, '#8a7a55');
  farmGrad.addColorStop(1, '#6a5a3a');
  ctx.fillStyle = farmGrad;
  ctx.beginPath();
  ctx.arc(fp.x, fp.y, fr, 0, Math.PI * 2);
  ctx.fill();

  // Beach and water (curved)
  for (let px = 0; px < W; px++) {
    const wx = ((px / W) - 0.5) * MAP_RANGE * 2;
    const bsz = beachStartZ(wx);
    const wsz = waterStartZ(wx);
    const beachPx = toMap(0, bsz).y;
    const waterPx = toMap(0, wsz).y;
    ctx.fillStyle = '#e8c840';
    ctx.fillRect(px, beachPx, 1, waterPx - beachPx);
    ctx.fillStyle = '#3098d0';
    ctx.fillRect(px, waterPx, 1, H - waterPx);
  }

  // City buildings markers
  const cmp = toMap(0, CITY_CENTER_Z);
  ctx.fillStyle = '#3a2208';
  for (const [bx, bz] of [[-14, 10], [-12, -8], [-13, -22], [12, 14], [13, -4], [13, -18]]) {
    const p = toMap(bx, CITY_CENTER_Z + bz);
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }

  // Trees (soft green dots)
  for (const t of treePositions) {
    const p = toMap(t.x, t.z);
    ctx.fillStyle = 'rgba(30, 90, 20, 0.7)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  // Challenges (glowing golden stars)
  for (const ch of challenges) {
    if (!ch.active) continue;
    const p = toMap(ch.position.x, ch.position.z);
    // Glow
    ctx.fillStyle = 'rgba(255, 220, 50, 0.3)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fill();
    // Star
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    for (let s = 0; s < 5; s++) {
      const a = (s / 5) * Math.PI * 2 - Math.PI / 2;
      const r1 = 4, r2 = 2;
      ctx.lineTo(p.x + Math.cos(a) * r1, p.y + Math.sin(a) * r1);
      const a2 = a + Math.PI / 5;
      ctx.lineTo(p.x + Math.cos(a2) * r2, p.y + Math.sin(a2) * r2);
    }
    ctx.closePath();
    ctx.fill();
  }

  // Horse — glowing arrow
  const hp = toMap(horsePos.x, horsePos.z);
  const dirX = Math.sin(horseAngle);
  const dirY = Math.cos(horseAngle);
  const perpX = -dirY;
  const perpY = dirX;

  // Glow behind horse
  ctx.fillStyle = 'rgba(255, 80, 80, 0.25)';
  ctx.beginPath();
  ctx.arc(hp.x, hp.y, 10, 0, Math.PI * 2);
  ctx.fill();

  // Arrow
  ctx.save();
  ctx.translate(hp.x, hp.y);
  ctx.fillStyle = '#ff3333';
  ctx.beginPath();
  ctx.moveTo(dirX * 8, dirY * 8);
  ctx.lineTo(perpX * 4 - dirX * 4, perpY * 4 - dirY * 4);
  ctx.lineTo(-dirX * 2, -dirY * 2);
  ctx.lineTo(-perpX * 4 - dirX * 4, -perpY * 4 - dirY * 4);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.stroke();
  // Center dot
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(0, 0, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // End clip
  ctx.restore();

  // Circular border (drawn outside clip)
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(R, R, R - 1, 0, Math.PI * 2);
  ctx.stroke();

  // Compass N indicator
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = 'bold 10px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('N', R, 12);
}

// ========== ANIMATION ==========
let lastHorseMoving = false;
let lastHorseGait = 'idle'; // 'idle' | 'walk' | 'gallop'

function switchHorseAnim(name) {
  if (!horseMixer || !horseActions[name]) return;
  if (lastHorseGait === name) return;
  lastHorseGait = name;
  const target = horseActions[name];
  const allActions = Object.values(horseActions);
  allActions.forEach(a => { if (a !== target) a.fadeOut(0.4); });
  target.reset().fadeIn(0.4).play();
}

const SWIM_DEPTH = 1.0; // only swim in properly deep water, never shallow wading
let prevHorseSpeed = 0;
let isStopping = false;  // playing the Run_Stop skid — don't let the gait selector override it
function animateHorse(dt, input) {
  if (!horseMixer) return;
  horseMixer.update(dt);
  if (isEatingCarrots || isJumping) return; // those animations own the horse

  const speed = Math.abs(horseSpeed);
  const turn = input ? input.turn : 0;
  const moving = input ? input.moving : false;
  const turning = Math.abs(turn) > 0.35;
  const lean = turn > 0 ? '_l' : '_r'; // lean into the turn (flip if it looks wrong)
  const deep = getWaterDepth(horsePos.x, horsePos.z) > SWIM_DEPTH;

  if (isStopping) { prevHorseSpeed = speed; return; }
  // Run_Stop: a skid when braking hard from a gallop to a halt (not from a walk).
  if (horseActions.run_stop && prevHorseSpeed > BASE_SPEED + 2 && !moving && speed < 2 && !deep) {
    isStopping = true;
    playHorseAnimation('run_stop', 700);
    setTimeout(() => { isStopping = false; }, 700);
    prevHorseSpeed = speed;
    return;
  }
  prevHorseSpeed = speed;

  let gait;
  if (deep) {
    gait = 'swim';
  } else if (!moving || speed < 0.1) {
    gait = 'idle';
  } else if (speed > BASE_SPEED + 2) {
    gait = turning ? 'gallop' + lean : 'gallop';
  } else {
    gait = turning ? 'walk' + lean : 'walk';
  }
  // Fall back gracefully if a model lacks a given clip.
  if (!horseActions[gait]) gait = gait.replace(/_[lr]$/, '');
  if (gait === 'swim' && !horseActions.swim) gait = speed > BASE_SPEED + 2 ? 'gallop' : (moving ? 'walk' : 'idle');
  if (!horseActions[gait]) gait = 'idle';

  switchHorseAnim(gait);
  // Slow the gallop so it reads natural, not frantic.
  horseMixer.timeScale = gait.startsWith('gallop') ? 0.65 : 1.0;
}

// ========== SPACE ACTION (mount/dismount farmer) ==========
function handleSpaceAction() {
  if (ridingFarmer) {
    const farmer = ridingFarmer;

    // Delivery — single owner. If parked within reach of the quest destination,
    // completePassengerDelivery handles detach, payout, marker cleanup, the
    // away-timer (so the passenger later asks to be brought home), and the next
    // quest. Radius is PASSENGER_DELIVERY_RADIUS (farm animals cluster around
    // FARM_X/FARM_Z, so parking at the edge still counts as arrival).
    if (farmer.quest) {
      const dx = horsePos.x - farmer.quest.destination.x;
      const dz = horsePos.z - farmer.quest.destination.z;
      if (Math.sqrt(dx * dx + dz * dz) < PASSENGER_DELIVERY_RADIUS) {
        completePassengerDelivery(farmer);
        return;
      }
    }

    // Plain dismount (not at a destination) — drop the farmer beside the horse.
    ridingFarmer = null;
    const dropX = horsePos.x - Math.sin(horseAngle) * 2 + Math.cos(horseAngle) * 2;
    const dropZ = horsePos.z - Math.cos(horseAngle) * 2 - Math.sin(horseAngle) * 2;
    const dropH = getTerrainHeight(dropX, dropZ);
    horseGroup.remove(farmer.group);
    farmer.group.position.set(dropX, dropH, dropZ);
    farmer.group.rotation.y = angleToRotationY(horseAngle);
    farmer.group.scale.set(1.4, 1.4, 1.4);
    scene.add(farmer.group);
    farmer.mounted = false;
    return;
  }

  // Try to mount — find closest farmer within range
  let closest = null, closestDist = 6;
  for (const farmer of farmers) {
    if (farmer.mounted) continue;
    const fdx = horsePos.x - farmer.group.position.x;
    const fdz = horsePos.z - farmer.group.position.z;
    const dist = Math.sqrt(fdx * fdx + fdz * fdz);
    if (dist < closestDist) {
      closest = farmer;
      closestDist = dist;
    }
  }
  if (closest) {
    // Mount farmer on horse
    ridingFarmer = closest;
    closest.mounted = true;
    // Remove from scene, add to horse group
    scene.remove(closest.group);
    closest.group.position.set(0, 1.8, 0); // sitting on horse's back
    closest.group.rotation.set(0, 0, 0);
    closest.group.scale.set(1, 1, 1); // relative to horse scale
    horseGroup.add(closest.group);
  }
}

// ========== HORSE MOTION ==========
// Owns the horse's kinematic step for one frame: turning, gallop acceleration,
// collision with wall-sliding, water drag, world-bounds clamp, and the jump /
// terrain-follow vertical. The world is reached only through the collider lists
// and terrain helpers — that is the seam between movement and the scene. The
// kinematic state stays in the shared globals (horsePos / horseAngle /
// horseSpeed / currentMaxSpeed / isJumping / jumpVy / runTimer) so the many
// readers — camera, passengers, save, minimap — are untouched; this module is
// their single WRITER during a frame. sprint (isSprinting) is decided in the
// loop because it is coupled to Stamina, and read here.
const TURN_SPEED = 2.0;
const JUMP_V0 = 6;
const JUMP_GRAVITY = 15;
const HORSE_RADIUS = 0.8;
const HorseMotion = {
  // Begin a jump if grounded. Returns true if it actually started, so the caller
  // can play the jump animation only when the jump fires.
  jump() {
    if (isJumping) return false;
    isJumping = true;
    jumpVy = JUMP_V0;
    return true;
  },

  // Advance the horse one frame. input: {turn, forward, turnIntent, moving}.
  // Reads isSprinting.
  step(input, dt) {
    // Tank-style turning — slower for easier aiming.
    horseAngle += input.turn * TURN_SPEED * dt;

    // Gallop acceleration: max speed ramps the longer you keep running.
    const sprintMult = isSprinting ? SPRINT_MULT : 1.0;
    if (Math.abs(input.forward) > 0.1) {
      runTimer += dt;
      const gallopT = THREE.MathUtils.clamp((runTimer - 1.5) / 3.0, 0, 1);
      currentMaxSpeed = THREE.MathUtils.lerp(BASE_SPEED, MAX_SPEED, gallopT);
      const targetSpeed = currentMaxSpeed * sprintMult * input.forward;
      horseSpeed = THREE.MathUtils.lerp(horseSpeed, targetSpeed, dt * 5);
    } else {
      runTimer = 0;
      currentMaxSpeed = BASE_SPEED;
      horseSpeed = THREE.MathUtils.lerp(horseSpeed, 0, dt * 8);
    }

    if (Math.abs(horseSpeed) > 0.01) this._move(dt);

    // Water drag.
    const waterDepth = getWaterDepth(horsePos.x, horsePos.z);
    if (waterDepth > 0) {
      horseSpeed *= Math.max(0.3, 1.0 - waterDepth * 1.5);
    }

    this._vertical(dt);
  },

  // Advance position with barn/tree collision, wall-sliding, water block, clamp.
  _move(dt) {
    const nextX = horsePos.x + Math.sin(horseAngle) * horseSpeed * dt;
    const nextZ = horsePos.z + Math.cos(horseAngle) * horseSpeed * dt;

    if (nextZ < WATER_DEEP_Z) {
      if (!this._blocked(nextX, nextZ)) {
        horsePos.x = nextX;
        horsePos.z = nextZ;
      } else {
        // Slide along the wall instead of a full stop (barn colliders only).
        if (!this._barnBlocked(nextX, horsePos.z)) horsePos.x = nextX;
        else if (!this._barnBlocked(horsePos.x, nextZ)) horsePos.z = nextZ;
        else horseSpeed *= 0.1;
      }
    } else {
      horseSpeed = 0;
    }

    horsePos.x = THREE.MathUtils.clamp(horsePos.x, -95, 95);
    horsePos.z = THREE.MathUtils.clamp(horsePos.z, CITY_SOUTH_EDGE + 5, WATER_DEEP_Z - 1);
  },

  // True if (x,z) hits a barn collider OR a tree.
  _blocked(x, z) {
    return this._barnBlocked(x, z) || this._treeBlocked(x, z);
  },
  _barnBlocked(x, z) {
    const r = HORSE_RADIUS;
    for (const c of barnColliders) {
      if (x + r > c.minX && x - r < c.maxX && z + r > c.minZ && z - r < c.maxZ) return true;
    }
    return false;
  },
  _treeBlocked(x, z) {
    for (const t of treePositions) {
      const dx = x - t.x, dz = z - t.z;
      if (Math.sqrt(dx * dx + dz * dz) < 1.0) return true;
    }
    return false;
  },

  // Jump integration, or follow the terrain when grounded.
  _vertical(dt) {
    const terrainY = getTerrainHeight(horsePos.x, horsePos.z);
    if (isJumping) {
      horsePos.y += jumpVy * dt;
      jumpVy -= JUMP_GRAVITY * dt;
      const groundY = Math.max(terrainY, WATER_LEVEL);
      if (horsePos.y <= groundY && jumpVy <= 0) {
        horsePos.y = groundY;
        isJumping = false;
        jumpVy = 0;
        // Force animateHorse to re-select gait next frame — playHorseAnimation
        // fades gallop_jump to idle, but lastHorseGait may still say 'gallop'.
        lastHorseGait = '';
      }
    } else {
      horsePos.y = Math.max(terrainY, WATER_LEVEL);
    }
  },
};

// ========== GAME LOOP ==========
function update() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const input = getInput();

  // Sprint mechanic: hold Left Shift while moving forward, consumes stamina.
  // Hysteresis: hitting empty locks sprinting off until stamina recovers past
  // SPRINT_RECOVER — otherwise a 1-frame regen at zero would let sprint fire
  // every other frame and effectively run forever on empty.
  if (Stamina.isEmpty()) staminaExhausted = true;
  else if (Stamina.value >= SPRINT_RECOVER) staminaExhausted = false;
  isSprinting = !!keys['ShiftLeft'] && input.forward > 0.1 && !staminaExhausted;
  if (isSprinting) Stamina.drain(dt); else Stamina.regen(dt);
  if (isSprinting) ensureSprintSparkles();

  // Advance the horse — turning, gallop, collision, water drag, jump.
  HorseMotion.step(input, dt);

  // Steering meter (mobile): show the raw steering intent (full range) so a full
  // push reads as a full turn, even though the horse rotates on the softened curve.
  updateSteerIndicator(input.turnIntent, input.moving);

  // Update horse transform — force position from terrain, not from animation
  horseGroup.position.copy(horsePos);
  horseGroup.rotation.y = horseAngle;
  // Clamp the inner model to prevent animation root motion bouncing
  if (horse) {
    horse.position.x = 0;
    horse.position.z = 0;
    horse.position.y = 0;
  }

  // Animate horse
  animateHorse(dt, input);

  // Camera follow — reuse a single scratch Vector3 per frame instead of alloc.
  // Camera — during eating, swing to the side so carrots are visible
  if (isEatingCarrots) {
    const perpX = Math.cos(horseAngle);
    const perpZ = -Math.sin(horseAngle);
    _scratchCamTarget.set(
      horsePos.x + perpX * 3 + Math.sin(horseAngle) * 0.5,
      horsePos.y + 1.5,
      horsePos.z + perpZ * 3 + Math.cos(horseAngle) * 0.5
    );
  } else {
    _scratchCamTarget.set(
      horsePos.x - Math.sin(horseAngle) * 6,
      horsePos.y + 4.5,
      horsePos.z - Math.cos(horseAngle) * 6
    );
  }
  camera.position.lerp(_scratchCamTarget, dt * 3);
  camera.lookAt(
    horsePos.x + Math.sin(horseAngle) * (isEatingCarrots ? 1 : 2),
    horsePos.y + (isEatingCarrots ? 0.5 : 1.0),
    horsePos.z + Math.cos(horseAngle) * (isEatingCarrots ? 1 : 2)
  );

  // Challenge management
  challengeCooldown -= dt;
  if (challenges.filter(c => c.active).length < 3 && challengeCooldown <= 0) {
    createChallenge();
    challengeCooldown = 2;
  }

  // Check proximity to challenges
  const questionBar = document.getElementById('question-bar');
  let nearChallenge = null;

  for (const ch of challenges) {
    if (!ch.active) continue;
    // Use 2D distance (ignore height differences from hills)
    const dx = horsePos.x - ch.position.x, dz = horsePos.z - ch.position.z;
    const dist = Math.sqrt(dx * dx + dz * dz);

    // Show question when close
    if (dist < 12) {
      nearChallenge = ch;
      ch.revealed = true;

      // Check collision with buckets (2D distance)
      for (const pile of ch.hayPiles) {
        const pdx = horsePos.x - (ch.position.x + pile.localX);
        const pdz = horsePos.z - ch.position.z;
        const pileDist = Math.sqrt(pdx * pdx + pdz * pdz);

        if (pileDist < 1.5) {
          handleAnswer(ch, pile);
        }
      }
    }

    // Animate glow orbs (gentle bob)
    // Orbs are the last children added to group
  }

  if (!nearChallenge) {
    questionBar.style.display = 'none';
    // Reset revealed state so question shows again on re-approach
    for (const ch of challenges) {
      if (ch.revealed && ch.active) {
        const rdx = horsePos.x - ch.position.x, rdz = horsePos.z - ch.position.z;
        if (Math.sqrt(rdx * rdx + rdz * rdz) >= 12) ch.revealed = false;
      }
    }
  }

  // Update all animation mixers (farm animals, birds, etc.)
  for (const mixer of animationMixers) {
    mixer.update(dt);
  }

  // Animate water, clouds, and birds
  // Animate water every 2nd frame
  window.__waterFrame = (window.__waterFrame || 0) + 1;
  if (window.__waterFrame % 2 === 0) animateWater(clock.elapsedTime);
  animateClouds(dt);
  animateBirds(dt);
  animateTumbleweeds(dt);
  animateCoinBurst(dt);
  animateFireworks(dt);
  animateSprintSparkles(dt);
  updateInteractionZones(dt);
  updateMobileButtons();
  updateLetterDelivery(dt);
  updateMud();
  updatePassengerQuests(dt);
  updateStaminaBar();
  updateCrab(dt);
  updateDalmatian(dt);
  updateCheetah(dt);
  updateBlueTiger(dt);

  // Remove far-away challenges (2D distance)
  for (let i = challenges.length - 1; i >= 0; i--) {
    const ch = challenges[i];
    if (!ch.active) continue;
    const fdx = horsePos.x - ch.position.x, fdz = horsePos.z - ch.position.z;
    const dist = Math.sqrt(fdx * fdx + fdz * fdz);
    if (dist > 80) {
      scene.remove(ch.group);
      challenges.splice(i, 1);
    }
  }

  // Eat apples near horse
  for (const apple of apples) {
    if (apple.eaten) continue;
    const adx = horsePos.x - apple.x, adz = horsePos.z - apple.z;
    const aDist = Math.sqrt(adx * adx + adz * adz);
    if (aDist < 2.0) {
      apple.eaten = true;
      // Apple falls and disappears
      const startY = apple.mesh.position.y;
      const startTime = Date.now();
      function animApple() {
        const t = (Date.now() - startTime) / 500;
        if (t < 1) {
          apple.mesh.position.y = startY - t * 2;
          apple.mesh.scale.setScalar(1 - t);
          requestAnimationFrame(animApple);
        } else {
          scene.remove(apple.mesh);
        }
      }
      animApple();
      applesCollected++;
      updateCarrotHUD();
      spawnConfetti({ x: apple.x, y: apple.y, z: apple.z });
      // Brief eating animation
      playHorseAnimation('eating', 1200);
      isEatingCarrots = true;
      setTimeout(() => { isEatingCarrots = false; }, 1200);
    }
  }

  // Push hay bales
  for (const bale of hayBales) {
    const bdx = bale.x - horsePos.x;
    const bdz = bale.z - horsePos.z;
    const bDist = Math.sqrt(bdx * bdx + bdz * bdz);
    if (bDist < 1.5 && Math.abs(horseSpeed) > 0.5) {
      // Push bale away from horse
      const pushForce = horseSpeed * dt * 2;
      const pushAngle = Math.atan2(bdx, bdz);
      bale.x += Math.sin(pushAngle) * pushForce;
      bale.z += Math.cos(pushAngle) * pushForce;
      // Keep in farm
      const fdx = bale.x - FARM_X, fdz = bale.z - FARM_Z;
      if (Math.sqrt(fdx * fdx + fdz * fdz) > FARM_RADIUS - 1) {
        bale.x -= Math.sin(pushAngle) * pushForce;
        bale.z -= Math.cos(pushAngle) * pushForce;
      }
      bale.mesh.position.x = bale.x;
      bale.mesh.position.z = bale.z;
      bale.mesh.position.y = getTerrainHeight(bale.x, bale.z) + 0.6;
      // Rotate bale as it rolls
      bale.mesh.children[0].rotation.x += pushForce * 0.5;
    }
  }

  // Animate farm animals (wander + flee from horse)
  animateFarmAnimals(dt);

  // Check if horse is near water trough — drinking animation
  const troughDx = horsePos.x - (FARM_X - 5);
  const troughDz = horsePos.z - (FARM_Z + 2);
  const troughDist = Math.sqrt(troughDx * troughDx + troughDz * troughDz);
  if (troughDist < 2.5 && Math.abs(horseSpeed) < 0.5) {
    if (!isDrinking) {
      isDrinking = true;
      drinkTimer = 0;
    }
    drinkTimer += dt;
    // Bend horse model down to drink
    if (horse) {
      const bendDown = Math.min(drinkTimer * 2, 1);
      horse.rotation.x = -0.25 * bendDown + Math.sin(drinkTimer * 2.5) * 0.03;
    }
  } else {
    if (isDrinking) {
      isDrinking = false;
      if (horse) horse.rotation.x = 0;
    }
  }

  // Draw minimap (throttled — every 3rd frame)
  window.__minimapFrame = (window.__minimapFrame || 0) + 1;
  if (window.__minimapFrame % 3 === 0) drawMinimap();

  // Shadow camera follows horse so small shadow map covers the action
  if (sun) {
    sun.position.set(horsePos.x + 30, 40, horsePos.z + 20);
    sun.target.position.set(horsePos.x, 0, horsePos.z);
    sun.target.updateMatrixWorld();
  }

  renderer.render(scene, camera);

  // Auto-degrade: disable shadows if FPS drops below 30
  window.__fpsFrames = (window.__fpsFrames || 0) + 1;
  if (!window.__fpsStart) window.__fpsStart = performance.now();
  const elapsed = performance.now() - window.__fpsStart;
  if (elapsed > 3000) {
    const fps = window.__fpsFrames / elapsed * 1000;
    if (fps < 30 && renderer.shadowMap.enabled) {
      renderer.shadowMap.enabled = false;
      scene.traverse(c => { c.castShadow = false; c.receiveShadow = false; });
      renderer.shadowMap.needsUpdate = true;
      console.log('Shadows disabled for performance (FPS was ' + fps.toFixed(0) + ')');
    }
    window.__fpsFrames = 0;
    window.__fpsStart = performance.now();
  }

  updateFpsMeter();
  requestAnimationFrame(update);
}

// ===== FPS meter (?fps=1) — cheap rolling window, only ticks DOM every ~0.5s =====
let fpsMeterEl = null;
let fpsMeterFrames = 0;
let fpsMeterStart = 0;
function updateFpsMeter() {
  if (fpsMeterEl === null) {
    if (!/[?&]fps=1\b/.test(location.search)) { fpsMeterEl = false; return; }
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;bottom:8px;right:8px;background:rgba(0,0,0,0.55);'
      + 'color:#8fffa5;padding:4px 10px;border-radius:8px;font:600 14px/1.1 monospace;'
      + 'pointer-events:none;z-index:9999;text-shadow:1px 1px 0 rgba(0,0,0,0.8);';
    el.textContent = '…';
    document.body.appendChild(el);
    fpsMeterEl = el;
    fpsMeterStart = performance.now();
  }
  if (!fpsMeterEl) return;
  fpsMeterFrames++;
  const now = performance.now();
  const dt = now - fpsMeterStart;
  if (dt >= 500) {
    const fps = (fpsMeterFrames * 1000) / dt;
    const info = renderer.info;
    fpsMeterEl.textContent =
      Math.round(fps) + ' fps · '
      + info.render.calls + ' dc · '
      + (info.render.triangles / 1000).toFixed(1) + 'k tri';
    fpsMeterEl.style.color = fps >= 55 ? '#8fffa5' : fps >= 30 ? '#ffe08a' : '#ff8a8a';
    fpsMeterFrames = 0;
    fpsMeterStart = now;
  }
}

// Real GLB carrots, but cheap: clone + brighten ONE template (once), then
// Object3D.clone() it 6x per bucket. clone() shares geometry and materials, so
// revealing a bucket is near-free — no per-carrot GLB clone or material work,
// which is what hitched on a correct answer.
let carrotTemplate = null;
function buildCarrots(pile) {
  if (pile.carrotsBuilt) return;
  pile.carrotsBuilt = true;
  if (!carrotTemplate) {
    carrotTemplate = cloneModel('carrot', 0.8); // ~0.4m; built once, reused forever
    if (carrotTemplate) brightenModel(carrotTemplate, 2.0);
  }
  if (!carrotTemplate) return;
  for (let c = 0; c < 6; c++) {
    const carrot = carrotTemplate.clone();
    carrot.position.set((Math.random() - 0.5) * 1.2, 0.15, 0.8 + Math.random() * 1.2);
    carrot.rotation.z = Math.PI / 2 + (Math.random() - 0.5) * 0.3; // laid on side
    carrot.rotation.y = Math.random() * Math.PI * 2;
    pile.carrotsGroup.add(carrot);
  }
}

function animateBucketTip(pile, isCorrect, challenge) {
  if (pile.revealed) return;
  pile.revealed = true;
  if (isCorrect) buildCarrots(pile);
  const pivot = pile.bucketPivot;
  const lid = pile.lidGroup;
  const hayGroup = pivot.parent; // hayGroup is parent of bucketPivot

  // Detach lid from rotating pivot → attach to stable hayGroup
  const lidWorldPos = new THREE.Vector3();
  lid.getWorldPosition(lidWorldPos);
  pivot.remove(lid);
  hayGroup.add(lid);
  // Set lid position in hayGroup local space
  lid.position.set(0, 1.0, 0);
  lid.rotation.set(0, 0, 0);

  const startTime = Date.now();

  function animate() {
    const elapsed = (Date.now() - startTime) / 1000;

    // Step 1: Lid pops up and lands to the side
    const lidT = Math.min(elapsed / 0.6, 1);
    lid.position.x = lidT * 1.5;
    lid.position.y = 1.0 + Math.sin(lidT * Math.PI) * 0.6 - lidT * 0.96;
    if (lid.position.y < 0.04) lid.position.y = 0.04;
    lid.rotation.z = lidT * 0.2;

    // Step 2 (0.1-0.5s): Bucket tips FORWARD (opening toward horse = +Z)
    if (elapsed > 0.1 && elapsed < 0.8) {
      const tipT = Math.min((elapsed - 0.1) / 0.4, 1);
      const eased = 1 - Math.pow(1 - tipT, 2);
      pivot.rotation.x = eased * (Math.PI * 0.45); // tip forward
      pivot.position.z = eased * 0.3; // shift forward slightly
      pivot.position.y = eased * 0.1;
    }

    // Step 3 (0.5-1.0s): Bucket keeps falling and rolls to the side
    if (elapsed > 0.5) {
      const rollT = Math.min((elapsed - 0.5) / 0.5, 1);
      const rollEase = 1 - Math.pow(1 - rollT, 2);
      pivot.rotation.x = Math.PI * 0.45 + rollEase * 0.15; // tip a bit more
      pivot.rotation.z = rollEase * (Math.PI * 0.3); // roll sideways
      pivot.position.x = -rollEase * 0.8; // slide to side
      pivot.position.z = 0.3 + rollEase * 0.3;
    }

    // Step 4: Carrots visible once bucket opening faces horse
    if (isCorrect && elapsed > 0.35) {
      pile.carrotsGroup.visible = true;
    }

    if (elapsed < 1.3) {
      requestAnimationFrame(animate);
    }
  }
  animate();
}

function playHorseAnimation(name, duration) {
  if (!horseMixer || !horseActions[name]) return;
  const action = horseActions[name];
  const allActions = Object.values(horseActions);
  allActions.forEach(a => { if (a !== action) a.fadeOut(0.3); });
  action.reset().fadeIn(0.3).setLoop(THREE.LoopOnce, 1).clampWhenFinished = true;
  action.play();
  // Return to idle after duration
  if (duration) {
    setTimeout(() => {
      const idleAction = horseActions['idle'] || horseActions['idle_2'] || allActions[0];
      if (idleAction) {
        allActions.forEach(a => { if (a !== idleAction) a.fadeOut(0.3); });
        idleAction.reset().fadeIn(0.3).play();
      }
      lastHorseMoving = false;
    }, duration);
  }
}

function handleAnswer(challenge, pile) {
  if (!challenge.active) return;
  if (pile.revealed) return;

  const questionBar = document.getElementById('question-bar');

  // Animate bucket tipping over
  animateBucketTip(pile, pile.correct, challenge);

  if (pile.correct) {
    challenge.active = false;
    carrots++;
    correctAnswers++;
    totalAnswers++;
    updateCarrotHUD();

    // Light confetti — gentle, colorful
    // Confetti from the correct bucket position
    spawnConfetti({
      x: challenge.position.x + pile.localX,
      y: challenge.position.y + 1.5,
      z: challenge.position.z,
    });
    updateDifficulty();

    // Carrots spill in front of the chosen bucket (+Z in hayGroup space)
    // = challenge.position + pile.localX on X, challenge.position.z + ~1.5 on Z
    const carrotAreaX = challenge.position.x + pile.localX;
    const carrotAreaZ = challenge.position.z + 1.5; // where carrots land

    // Position horse 2m behind the carrot area, facing them
    const dx = carrotAreaX - horsePos.x;
    const dz = carrotAreaZ - horsePos.z;
    const dist = Math.sqrt(dx * dx + dz * dz) || 1;
    horsePos.x = carrotAreaX - (dx / dist) * 2.0;
    horsePos.z = carrotAreaZ - (dz / dist) * 2.0;
    horsePos.y = getTerrainHeight(horsePos.x, horsePos.z);
    // Face the carrots
    const dx2 = carrotAreaX - horsePos.x;
    const dz2 = carrotAreaZ - horsePos.z;
    horseAngle = Math.atan2(dx2, dz2);
    horseGroup.position.copy(horsePos);
    horseGroup.rotation.y = horseAngle;
    horseSpeed = 0;

    isEatingCarrots = true;
    playHorseAnimation('eating', 2500);

    // Carrots disappear one by one with shrink animation during eating
    // Always grab children — carrotsGroup becomes visible later in bucket animation
    const carrotMeshes = pile.carrotsGroup.children.slice();
    // Start shrinking after carrots become visible (0.5s) + spread across 1.5s
    const shrinkStartMs = 600;
    const eatDelay = 1500 / (carrotMeshes.length + 1);
    carrotMeshes.forEach((carrot, idx) => {
      setTimeout(() => {
        // Shrink and vanish
        const shrinkStart = Date.now();
        function shrinkCarrot() {
          const t = (Date.now() - shrinkStart) / 300;
          if (t >= 1) { carrot.visible = false; return; }
          const s = 1 - t;
          carrot.scale.set(s, s, s);
          carrot.position.y += 0.01; // float up slightly
          requestAnimationFrame(shrinkCarrot);
        }
        shrinkCarrot();
      }, shrinkStartMs + (idx + 1) * eatDelay);
    });

    setTimeout(() => {
      isEatingCarrots = false;
    }, 2500);

    // Fade out challenge gate after 10s
    setTimeout(() => {
      const fadeStart = Date.now();
      function fadeGate() {
        const t = (Date.now() - fadeStart) / 2000;
        if (t >= 1) {
          scene.remove(challenge.group);
          const idx = challenges.indexOf(challenge);
          if (idx >= 0) challenges.splice(idx, 1);
          return;
        }
        challenge.group.traverse((child) => {
          if (child.isMesh && child.material && child.visible) {
            child.material.transparent = true;
            child.material.opacity = 1 - t;
          }
        });
        requestAnimationFrame(fadeGate);
      }
      fadeGate();
    }, 10000);
  } else {
    // Wrong — clear push back away from bucket
    totalAnswers++;
    horseSpeed = -3;
    horsePos.x -= Math.sin(horseAngle) * 3.5;
    horsePos.z -= Math.cos(horseAngle) * 3.5;
    updateDifficulty();
  }

  questionBar.style.display = 'none';
}

// Level structure:
// Lvl 1: addition 1-5 (dots only)
// Lvl 2: addition 1-7 (dots + some numbers)
// Lvl 3: addition + subtraction 1-7
// Lvl 4: addition + subtraction 1-9
// Lvl 5: addition + subtraction 1-10 (numbers)
// Lvl 6: 1-12
// Lvl 7: 1-15
// Each row is the COMPLETE rule set for that level — no difficulty thresholds
// live in the generators anymore. maxNum: number range. useVisual: render dots
// instead of numerals. canSubtract: subtraction is unlocked. subCap: largest
// value a subtraction problem may use. allowZeroWrong: wrong answers may be 0.
// needed: correct answers required to advance.
const LEVELS = [
  { name: 'Poziom 1', maxNum: 5,  useVisual: true,  canSubtract: false, subCap: 4,  allowZeroWrong: false, needed: 2 },
  { name: 'Poziom 2', maxNum: 7,  useVisual: true,  canSubtract: true,  subCap: 4,  allowZeroWrong: true,  needed: 2 },
  { name: 'Poziom 3', maxNum: 7,  useVisual: true,  canSubtract: true,  subCap: 4,  allowZeroWrong: true,  needed: 2 },
  { name: 'Poziom 4', maxNum: 9,  useVisual: false, canSubtract: true,  subCap: 9,  allowZeroWrong: true,  needed: 3 },
  { name: 'Poziom 5', maxNum: 10, useVisual: false, canSubtract: true,  subCap: 10, allowZeroWrong: true,  needed: 3 },
  { name: 'Poziom 6', maxNum: 12, useVisual: false, canSubtract: true,  subCap: 12, allowZeroWrong: true,  needed: 3 },
  { name: 'Poziom 7', maxNum: 15, useVisual: false, canSubtract: true,  subCap: 15, allowZeroWrong: true,  needed: 3 },
];

// Single source of truth for the current level's rules. `level` is the only
// difficulty state; maxNumber and the per-level thresholds derive from here.
function levelRules() {
  return LEVELS[Math.min(Math.max(level, 1) - 1, LEVELS.length - 1)];
}

function updateDifficulty() {
  const rate = totalAnswers > 0 ? correctAnswers / totalAnswers : 0;

  // Fast advancement early, slower later — threshold comes from the level row.
  const needed = levelRules().needed;
  if (correctAnswers >= needed && rate >= 0.65 && level < LEVELS.length) {
    level = Math.min(level + 1, LEVELS.length);
    document.getElementById('level-display').textContent = levelRules().name;
    correctAnswers = 0;
    totalAnswers = 0;
    // TODO: celebration for level up
  } else if (totalAnswers >= 5 && rate < 0.35 && level > 1) {
    level = Math.max(1, level - 1);
    document.getElementById('level-display').textContent = levelRules().name;
    correctAnswers = 0;
    totalAnswers = 0;
  }
}

// ========== CONFETTI (gentle, colorful) ==========
function spawnConfetti(pos) {
  const count = 25;
  const confettiPieces = [];
  // Soft pastel colors for kids
  const confettiColors = [0xff8888, 0x88ff88, 0x8888ff, 0xffff66, 0xff88ff, 0x88ffff, 0xffbb44];

  for (let i = 0; i < count; i++) {
    const geo = new THREE.PlaneGeometry(0.12, 0.08);
    const color = confettiColors[Math.floor(Math.random() * confettiColors.length)];
    const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 1 });
    const piece = new THREE.Mesh(geo, mat);
    piece.position.set(
      pos.x + (Math.random() - 0.5) * 2,
      pos.y + 2 + Math.random() * 1,
      pos.z + (Math.random() - 0.5) * 2
    );
    piece.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
    scene.add(piece);
    confettiPieces.push({
      mesh: piece,
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 3 + 1,
      vz: (Math.random() - 0.5) * 3,
      rotSpeed: (Math.random() - 0.5) * 8,
    });
  }

  let time = 0;
  function animateConfetti() {
    time += 0.016;
    if (time > 2.5) {
      for (const p of confettiPieces) {
        scene.remove(p.mesh);
        p.mesh.geometry.dispose();
        p.mesh.material.dispose();
      }
      return;
    }

    for (const p of confettiPieces) {
      p.mesh.position.x += p.vx * 0.016;
      p.mesh.position.y += p.vy * 0.016;
      p.mesh.position.z += p.vz * 0.016;
      p.vy -= 2.5 * 0.016; // gentle gravity (slower than real)
      p.mesh.rotation.x += p.rotSpeed * 0.016;
      p.mesh.rotation.z += p.rotSpeed * 0.5 * 0.016;
      // Fade out in last second
      if (time > 1.5) {
        p.mesh.material.opacity = 1 - (time - 1.5) / 1.0;
      }
    }
    requestAnimationFrame(animateConfetti);
  }
  animateConfetti();
}

// ========== STATE PERSISTENCE (hot reload) ==========
function saveState() {
  // Serialize active challenges
  const savedChallenges = challenges.filter(c => c.active).map(ch => ({
    x: ch.position.x, z: ch.position.z,
    question: ch.question, answer: ch.answer,
    answers: ch.hayPiles.map(p => ({ answer: p.answer, correct: p.correct, revealed: p.revealed })),
  }));

  const state = {
    horseX: horsePos.x, horseY: horsePos.y, horseZ: horsePos.z,
    horseAngle, horseSpeed, carrots, applesCollected, money, inventory, stamina: Stamina.value, level, groomLevel, isDirty,
    correctAnswers, totalAnswers, runTimer,
    challenges: savedChallenges,
    gameStarted: true,
  };
  localStorage.setItem(SAVE_KEY, JSON.stringify(state));
}

function loadState() {
  try {
    let raw = localStorage.getItem(SAVE_KEY);
    if (!raw) {
      // Migrate from previous sessionStorage-based build so kids don't
      // lose progress on the first reload after this switch.
      raw = sessionStorage.getItem(SAVE_KEY);
      if (raw) {
        localStorage.setItem(SAVE_KEY, raw);
        sessionStorage.removeItem(SAVE_KEY);
      }
    }
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}

// ========== START ==========
function resetGame() {
  localStorage.removeItem(SAVE_KEY);
  location.reload();
}

window.startGame = async function () {
  const introEl = document.getElementById('intro');
  const btn = introEl.querySelector('button');
  btn.textContent = 'Loading models...';
  btn.disabled = true;

  // Load all GLB models first
  await loadAllModels((fraction) => {
    const pct = Math.max(0, Math.min(100, Math.round(fraction * 100)));
    btn.textContent = `Loading... ${pct}%`;
  });

  introEl.style.display = 'none';

  initScene();
  createHorse();
  initInput();
  initMinimap();

  // Restore state if hot-reloading
  const saved = loadState();
  if (saved) {
    horsePos.set(saved.horseX, saved.horseY, saved.horseZ);
    horseAngle = saved.horseAngle;
    horseSpeed = saved.horseSpeed || 0;
    carrots = saved.carrots;
    applesCollected = saved.applesCollected || 0;
    money = saved.money || 0;
    Stamina.set(saved.stamina != null ? saved.stamina : MAX_STAMINA);
    if (saved.inventory) {
      inventory = { napoj: 0, siano: 0, diament: 0, odznaka: 0, list: 0, podkowa: 0, fajerwerki: 0, ...saved.inventory };
    }
    level = saved.level;
    groomLevel = saved.groomLevel || 0;
    isDirty = !!saved.isDirty;
    refreshHorseLook();
    correctAnswers = saved.correctAnswers;
    totalAnswers = saved.totalAnswers;
    runTimer = saved.runTimer || 0;
    updateCarrotHUD();
    document.getElementById('level-display').textContent = levelRules().name;
    horseGroup.position.copy(horsePos);
    horseGroup.rotation.y = horseAngle;

    // Unstick horse if spawned inside a collider
    const hr = 0.8;
    for (const c of barnColliders) {
      if (horsePos.x + hr > c.minX && horsePos.x - hr < c.maxX &&
          horsePos.z + hr > c.minZ && horsePos.z - hr < c.maxZ) {
        // Push toward nearest edge
        const pushX = (horsePos.x < (c.minX + c.maxX) / 2) ? c.minX - hr - 0.5 : c.maxX + hr + 0.5;
        horsePos.x = pushX;
      }
    }
    horseGroup.position.copy(horsePos);

    // Snap camera directly behind horse — no lerp animation
    const camX = horsePos.x - Math.sin(horseAngle) * 6;
    const camY = horsePos.y + 4.5;
    const camZ = horsePos.z - Math.cos(horseAngle) * 6;
    camera.position.set(camX, camY, camZ);
    camera.lookAt(horsePos.x + Math.sin(horseAngle) * 2, horsePos.y + 1.0, horsePos.z + Math.cos(horseAngle) * 2);

    // Always generate fresh challenges (old format incompatible)
    for (let i = 0; i < 3; i++) createChallenge();
  } else {
    // Spawn initial challenges
    for (let i = 0; i < 3; i++) createChallenge();
  }

  // Testing top-up via ?cash=N — only inside a named test slot, so the shared
  // family save can never be cheated/polluted by a stray ?cash in the URL.
  if (CHEAT_CASH && SAVE_NAME) { money += CHEAT_CASH; updateCarrotHUD(); }

  // Assign initial passenger delivery quests to townspeople
  if (farmers.length > 0) assignNewPassengerQuest();

  // Save state periodically
  setInterval(saveState, 500);

  update();
};

// Auto-start if we're hot-reloading
const savedState = loadState();
if (savedState && savedState.gameStarted) {
  window.startGame(); // async, will load models then start
}

// ========== HOT RELOAD (dev) ==========
if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
  const sse = new EventSource('/__reload');
  sse.onmessage = (e) => {
    if (e.data === 'reload') {
      saveState();
      location.reload();
    }
  };
}
